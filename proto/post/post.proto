syntax = "proto3";

package post;

option go_package = "ouroboros/proto/post";

// import "common/common.proto";

service PostService {
  rpc CreatePost (CreatePostRequest) returns (Post);
  rpc GetPost (GetPostRequest) returns (Post);
  rpc GetPostsByIds (GetPostsByIdsRequest) returns (GetPostsByIdsResponse);
  rpc GetPostsByAuthorId (GetPostsByAuthorIdRequest) returns (GetPostsByAuthorIdResponse);
  rpc CreateComment (CreateCommentRequest) returns (Comment);
  rpc GetCommentsByPostId (GetCommentsRequest) returns (GetCommentsResponse);
  rpc LikePost (LikePostRequest) returns (LikePostResponse);
}

message CreatePostRequest {
  string author_id = 1;
  string content = 2;
}

message GetPostRequest {
  string id = 1;
}

message GetPostsByIdsRequest {
  repeated string ids = 1;
}

message GetPostsByIdsResponse {
  repeated Post posts = 1;
}

message GetPostsByAuthorIdRequest {
  string author_id = 1;
  int32 limit = 2;
}

message GetPostsByAuthorIdResponse {
  repeated Post posts = 1;
}

message CreateCommentRequest {
  string post_id = 1;
  string author_id = 2;
  string content = 3;
}

message GetCommentsRequest {
  string post_id = 1;
  // common.Pagination pagination = 2;
}

message GetCommentsResponse {
  repeated Comment comments = 1;
  // common.PageInfo page_info = 2;
}

message Post {
  string id = 1;
  string author_id = 2;
  string content = 3;
  string created_at = 4;
}

message Comment {
  string id = 1;
  string post_id = 2;
  string author_id = 3;
  string content = 4;
  string created_at = 5;
}

message LikePostRequest {
  string post_id = 1;
  string user_id = 2;
}

message LikePostResponse {
  bool success = 1;
}