
<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <g transform="rotate(90 100 100)">
    <!-- Black half -->
    <path
      d="M 100 20 A 80 80 0 0 0 100 180"
      fill="none"
      stroke="black"
      stroke-width="28"
    />

    <!-- White half -->
    <path
      d="M 100 180 A 80 80 0 0 0 100 20"
      fill="none"
      stroke="white"
      stroke-width="28"
    />

    <!-- Outer black outline -->
    <circle
      cx="100"
      cy="100"
      r="94"
      fill="none"
      stroke="black"
      stroke-width="2"
    />

    <!-- Inner black outline -->
    <circle
      cx="100"
      cy="100"
      r="66"
      fill="none"
      stroke="black"
      stroke-width="2"
    />
  </g>
</svg>
